<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日赛事 - 足球 / 乒乓 / LOL</title>
<style>
  :root {
    color-scheme: light;
    --accent: #2e6be6;        /* 主题色 */
    --accent-light: #eef3fe;  /* 主题极浅底 */
    --accent-border: #ccd9f6; /* 主题浅边框 */
    --bg: #ffffff;
    --bg-soft: #f7f8f9;
    --text: #333;
    --text-2: #888;
    --text-3: #aaa;
    --line: #f0f1f2;          /* 分割线 */
    --line-2: #e6e8eb;        /* 控件边框 */
    --line-hover: #d0d3d8;    /* 控件悬停边框 */
    --hot-bg: #fbeaea;        /* 「重要」标签 */
    --hot-text: #b23b32;
    --ok: #3d8b40;            /* 状态文字 */
    --live: #b23b32;
    --footer: #c0c3c8;
  }
  html.dark {
    color-scheme: dark;
    --accent: #6b9bf5;
    --accent-light: #1c2a45;
    --accent-border: #33456b;
    --bg: #15171a;
    --bg-soft: #1f2227;
    --text: #e4e6e9;
    --text-2: #9aa0a6;
    --text-3: #6f757d;
    --line: #26292e;
    --line-2: #34383e;
    --line-hover: #4a4f56;
    --hot-bg: #3a2426;
    --hot-text: #e69088;
    --ok: #85c287;
    --live: #e69088;
    --footer: #565b62;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ---------- 顶部 ---------- */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .topbar h1 { font-size: 20px; font-weight: 600; }
  .topbar .meta { margin-top: 6px; font-size: 13px; color: var(--text-3); }
  .top-actions { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    margin-top: 2px; width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; border-radius: 6px;
    color: var(--text-2); cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-soft); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- 推荐/全部 分段控制器 ---------- */
  .segmented {
    display: inline-flex; background: var(--bg-soft);
    border-radius: 8px; padding: 3px; margin-bottom: 20px;
  }
  .segmented button {
    border: none; background: transparent; color: var(--text-2);
    padding: 6px 20px; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .segmented button.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .segmented button .num { margin-left: 4px; font-size: 12px; color: var(--text-3); }
  .segmented button.active .num { color: var(--accent); opacity: .65; }

  /* ---------- 筛选标签分组 ---------- */
  .fgroup { display: flex; align-items: flex-start; gap: 12px; }
  .fgroup + .fgroup { margin-top: 16px; } /* 组间垂直留白 */
  .fgroup-label {
    flex-shrink: 0; width: 60px; padding-top: 6px;
    font-size: 12px; color: var(--text-3);
  }
  .ftags { display: flex; flex-wrap: wrap; gap: 8px; }
  .ftags button {
    border: 1px solid var(--line-2); background: var(--bg); color: var(--text-2);
    padding: 5px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    line-height: 1.4;
  }
  .ftags button:hover { color: var(--text); border-color: var(--line-hover); }
  .ftags button.active {
    color: var(--accent); background: var(--accent-light);
    border-color: var(--accent-border); font-weight: 600;
  }
  .ftags button .num { margin-left: 3px; font-size: 11px; color: #b8bcc2; }
  .ftags button.active .num { color: var(--accent); opacity: .6; }
  /* 所选日期该分类有比赛：底部小圆点提示（与日期chip一致） */
  .ftags button.has-match { position: relative; }
  .ftags button.has-match::after {
    content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }

  /* ---------- 日期横向滚动条 ---------- */
  .date-fixed { display: flex; gap: 8px; margin: 22px 0 6px; }
  .date-row { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
  .date-arrow {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line-2); background: var(--bg); color: var(--text-2);
    font-size: 14px; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .date-arrow:hover { color: var(--text); border-color: var(--line-hover); }
  .date-arrow.off { opacity: .3; pointer-events: none; }
  .date-scroll {
    display: flex; gap: 8px; overflow-x: auto; scroll-behavior: smooth;
    scrollbar-width: none; padding: 2px;
  }
  .date-scroll::-webkit-scrollbar { display: none; }
  .date-chip {
    flex-shrink: 0; min-width: 62px; text-align: center;
    border: 1px solid transparent; background: var(--bg-soft); color: var(--text-2);
    border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  .date-chip .d { font-size: 13px; }
  .date-chip .w { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .date-chip:hover { color: var(--text); }
  .date-chip.active { background: var(--accent-light); border-color: var(--accent-border); color: var(--accent); }
  .date-chip.active .w { color: var(--accent); opacity: .65; }
  /* 当前页签下该日期有比赛：底部小圆点提示 */
  .date-chip.has-match { position: relative; }
  .date-chip.has-match::after {
    content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .date-chip.has-match.active::after { background: var(--accent); }

  /* ---------- 赛事列表（行式极简） ---------- */
  .list { margin-top: 10px; }
  .ghead { margin: 18px 0 2px; font-size: 12px; color: var(--text-3); font-weight: 500; }
  .list .ghead:first-child { margin-top: 6px; }
  .erow {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 4px; border-bottom: 1px solid var(--line);
  }
  .erow .t { width: 46px; flex-shrink: 0; font-size: 14px; color: var(--text-2); }
  .erow .mid { flex: 1; min-width: 0; }
  .erow .league { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .erow .league .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .erow .league .hot {
    flex-shrink: 0; font-size: 11px; padding: 1px 6px; border-radius: 3px;
    background: var(--hot-bg); color: var(--hot-text);
  }
  .erow .teams {
    margin-top: 4px; font-size: 16px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .erow .teams .vs { color: var(--text-3); margin: 0 6px; font-size: 12px; font-weight: 400; }
  .erow .teams .score { color: var(--accent); margin: 0 6px; font-size: 15px; font-weight: 700; }
  .erow .right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .erow .status { font-size: 12px; color: var(--ok); }
  .erow .status.live { color: var(--live); }
  .erow .channel {
    font-size: 11px; color: var(--text-2); background: var(--bg-soft);
    padding: 2px 7px; border-radius: 3px; white-space: nowrap;
  }
  .erow a.watch {
    font-size: 12px; color: var(--accent); text-decoration: none;
    border: 1px solid var(--accent-border); border-radius: 999px; padding: 4px 13px;
  }
  .erow a.watch:hover { background: var(--accent-light); }

  .empty { text-align: center; color: var(--text-3); padding: 60px 0; font-size: 14px; }
  .err { text-align: center; color: var(--live); padding: 40px 0; font-size: 14px; }

  footer { margin-top: 32px; font-size: 12px; color: var(--footer); text-align: center; }

  /* ---------- 移动端（压缩垂直留白，扩大可视区） ---------- */
  @media (max-width: 640px) {
    .container { padding: 12px 14px 20px; }
    .topbar { margin-bottom: 8px; }
    .topbar h1 { font-size: 18px; }
    .topbar .meta { margin-top: 4px; font-size: 12px; }
    .segmented { margin-bottom: 10px; padding: 2px; }
    .segmented button { padding: 5px 14px; font-size: 13px; }
    .segmented button .num { font-size: 11px; }
    .fgroup { flex-direction: column; gap: 6px; }
    .fgroup + .fgroup { margin-top: 8px; }
    .fgroup-label { width: auto; padding-top: 0; font-size: 11px; }
    .ftags { gap: 6px; }
    .ftags button { padding: 4px 11px; font-size: 12px; }
    .ftags button .num { font-size: 10px; }
    .date-arrow { display: none; } /* 触屏直接滑动 */
    .date-fixed { margin: 10px 0 4px; gap: 6px; }
    .date-row { margin-bottom: 2px; }
    .date-chip { min-width: 54px; padding: 4px 8px; }
    .date-chip .d { font-size: 12px; }
    .date-chip .w { font-size: 10px; margin-top: 0; }
    .list { margin-top: 4px; }
    .list .ghead { margin: 10px 0 0; }
    .erow { gap: 10px; padding: 8px 0; }
    .erow .t { width: 40px; font-size: 13px; }
    .erow .league { font-size: 11px; }
    /* B6: 手机端允许队名折行，防止长队名（如巴黎圣日耳曼）被截断 */
    .erow .teams { margin-top: 2px; font-size: 14px; white-space: normal; line-height: 1.3; }
    .erow .channel { max-width: 76px; overflow: hidden; text-overflow: ellipsis; }
    footer { margin-top: 16px; }
  }
  /* B5: 刷新按钮加载动画 */
  .icon-btn.loading svg { animation: spin 0.8s linear infinite; }
  .icon-btn.loading { pointer-events: none; opacity: .5; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
<script>
// 提前应用主题，避免深色用户看到白色闪烁
(function () {
  var t = localStorage.getItem('theme');
  if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if (t === 'dark') document.documentElement.classList.add('dark');
})();
</script>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div>
      <h1>每日赛事</h1>
      <div class="meta"><span id="meta">加载中…</span></div>
    </div>
    <div class="top-actions">
      <button id="cardBtn" class="icon-btn" title="今日赛事卡片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 20V9"/></svg>
      </button>
      <button id="themeToggle" class="icon-btn" title="切换深色模式"></button>
      <button id="refresh" class="icon-btn" title="重新抓取数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>
  </header>

  <div class="segmented" id="segmented"></div>

  <section id="tabs"></section>

  <div class="date-fixed" id="datesFixed"></div>

  <div class="date-row">
    <button class="date-arrow" id="datePrev" title="向前">‹</button>
    <div class="date-scroll" id="dates"></div>
    <button class="date-arrow" id="dateNext" title="向后">›</button>
  </div>

  <div class="list" id="list"><div class="empty">加载中…</div></div>

  <footer>数据来源：直播吧 zhibo8.com · 仅供个人学习参考</footer>
</div>

<script>
// 页签数据：推荐/全部为顶部分段控制器，其余按三组展示
const SEGMENTED = [
  { key: 'recommended', name: '关注比赛' },
  { key: 'all',         name: '全部比赛' },
];
const TAB_GROUPS = [
  { label: '足球联赛', keys: ['football', 'yingchao', 'zhongchao', 'xijia', 'ouguan', 'zuxiebei', 'yaguan'] },
  { label: '我的球队', keys: ['mancity', 'arsenal', 'manutd', 'chelsea', 'liverpool', 'barcelona', 'realmadrid', 'atletico', 'psg', 'bayern', 'inter', 'napoli', 'shenhua', 'shanggang', 'chinamb'] },
  { label: '其他赛事', keys: ['pingpong', 'dejia', 'duesseldorf', 'lol'] },
];
const ALL_KEYS = [...SEGMENTED.map(s => s.key), ...TAB_GROUPS.flatMap(g => g.keys)];
const NAME = {
  recommended: '关注比赛', all: '全部比赛',
  football: '足球', yingchao: '英超', zhongchao: '中超', xijia: '西甲', ouguan: '欧冠', zuxiebei: '足协杯', yaguan: '亚冠',
  mancity: '曼城', arsenal: '阿森纳', manutd: '曼联', chelsea: '切尔西', liverpool: '利物浦',
  barcelona: '巴塞罗那', realmadrid: '皇马', atletico: '马竞',
  psg: '巴黎', bayern: '拜仁', inter: '国米', napoli: '那不勒斯',
  shenhua: '申花', shanggang: '上港', chinamb: '中国男篮',
  pingpong: 'WTT', dejia: '德乒', duesseldorf: '杜塞尔多夫', lol: 'LOL', other: '其他',
};
const SUB_KEYS = ['yingchao', 'zhongchao', 'ouguan', 'xijia', 'zuxiebei', 'yaguan'];
const TEAM_KEYS = ['mancity', 'arsenal', 'manutd', 'chelsea', 'liverpool', 'shenhua', 'shanggang', 'barcelona', 'realmadrid', 'atletico', 'psg', 'bayern', 'inter', 'napoli', 'chinamb', 'duesseldorf'];
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

let category = localStorage.getItem('cat') || 'recommended';
if (!ALL_KEYS.includes(category)) category = 'recommended';
let dateFilter = '';   // '' = 全部日期
let dateInited = false; // 首次加载后默认选中"今天"（之后用户手动切换不受影响）
let cache = null;      // { crawledAt, today, events }

const $list = document.getElementById('list');
const $tabs = document.getElementById('tabs');
const $dates = document.getElementById('dates');
const $datesFixed = document.getElementById('datesFixed');
const $meta = document.getElementById('meta');

// GitHub Pages 静态部署时读取仓库内数据文件（由 Actions 每日更新）；本地运行读本地 API
const IS_STATIC = location.hostname.endsWith('github.io');
const DATA_URL = IS_STATIC ? 'data/events.json' : '/api/events';

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// 可用日期（升序排序；多数据源混合：直播吧从今天起向未来，WTT/德乒甲含历史日期）
function availableDates() {
  const seen = new Set();
  for (const e of cache.events) seen.add(e.date);
  // 按日期升序排序（数据源是混合的：直播吧从今天起向未来，WTT/德乒甲含历史日期，不排序会乱）
  return [...seen].sort();
}

function localToday() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}

function dateLabel(ds) {
  const d = new Date(ds + 'T00:00:00');
  const label = ds === cache.today ? '今天' :
    `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  return { label, week: '周' + WEEK[d.getDay()] };
}

function matchCategory(e, key) {
  if (SUB_KEYS.includes(key)) return e.category === 'football' && e.sub === key;
  if (key === 'dejia') return e.category === 'pingpong' && /德甲|德国杯/.test(e.label || '');
  // B2: 乒乓标签排除德乒甲/德国杯（那些归"德乒"标签管）
  if (key === 'pingpong') return e.category === 'pingpong' && !/德甲|德国杯/.test(e.label || '');
  if (TEAM_KEYS.includes(key)) return Array.isArray(e.teams) && e.teams.includes(key);
  return e.category === key;
}

// 推荐定义：关注球队参与的比赛直接进推荐（含德乒甲杜塞尔多夫，无important标记）；
// 其余需 important 且属于关注的联赛/乒/LOL，避免周末"全平台标重要"导致推荐=全部
function isRecommended(e) {
  if (Array.isArray(e.teams) && e.teams.length > 0) return true; // 关注球队参与的比赛一律推荐
  if (!e.important) return false;
  if (e.category === 'football' && SUB_KEYS.includes(e.sub)) return true; // 关注联赛(英超/中超/西甲/欧冠/足协杯/亚冠)
  if (e.category === 'pingpong' || e.category === 'lol') return true; // 乒乓(WTT决赛/半决赛由爬虫标important)+LOL
  return false;
}

function filtered() {
  let ev = cache.events;
  if (category === 'recommended') ev = ev.filter(isRecommended);
  else if (category !== 'all') ev = ev.filter(e => matchCategory(e, category));
  if (dateFilter) ev = ev.filter(e => e.date === dateFilter);
  return ev;
}

// ---------- 顶部：推荐/全部 分段控制器 ----------
function renderSegmented(counts) {
  const $seg = document.getElementById('segmented');
  $seg.innerHTML = '';
  for (const c of SEGMENTED) {
    const btn = document.createElement('button');
    if (c.key === category) btn.classList.add('active');
    btn.innerHTML = c.name + (counts[c.key] !== undefined ? ` <span class="num">${counts[c.key]}</span>` : '');
    btn.onclick = () => {
      category = c.key;
      localStorage.setItem('cat', category);
      render(); // 数据已全量缓存，本地过滤即可
    };
    $seg.appendChild(btn);
  }
}

// ---------- 筛选标签：三组，组间留白 ----------
function renderTabs(counts) {
  $tabs.innerHTML = '';
  for (const g of TAB_GROUPS) {
    const row = document.createElement('div');
    row.className = 'fgroup';
    const label = document.createElement('div');
    label.className = 'fgroup-label';
    label.textContent = g.label;
    row.appendChild(label);
    const wrap = document.createElement('div');
    wrap.className = 'ftags';
    for (const key of g.keys) {
      const btn = document.createElement('button');
      if (key === category) btn.classList.add('active');
      if (counts[key] > 0) btn.classList.add('has-match'); // 所选日期该分类有比赛，显示圆点
      btn.innerHTML = NAME[key] + (counts[key] !== undefined ? ` <span class="num">${counts[key]}</span>` : '');
      btn.onclick = () => {
        category = key;
        localStorage.setItem('cat', category);
        render(); // 数据已全量缓存，本地过滤即可，数量不会错
      };
      wrap.appendChild(btn);
    }
    row.appendChild(wrap);
    $tabs.appendChild(row);
  }
}

// ---------- 日期：上排固定(全部/今天) + 横向滚动日期条 ----------
// matchDates: 当前页签下有比赛的日期集合（用于在日期chip上画高亮圆点）
function renderDates(dates, matchDates) {
  $dates.innerHTML = '';
  $datesFixed.innerHTML = '';
  const mkChip = (val, top, week) => {
    const btn = document.createElement('button');
    btn.className = 'date-chip' + ((dateFilter || '') === (val || '') ? ' active' : '');
    if (val && matchDates && matchDates.has(val)) btn.classList.add('has-match'); // 当前分类该日期有比赛
    btn.innerHTML = `<div class="d">${top}</div><div class="w">${week}</div>`;
    btn.onclick = () => { dateFilter = val; render(); }; // 重新渲染时页签数量会按所选日期重算
    return btn;
  };
  // 上排固定：所有日期 + 今天（今天有赛事时才显示）
  $datesFixed.appendChild(mkChip('', '所有日期', '全部'));
  const today = (cache && cache.today) || localToday();
  if (dates.includes(today)) {
    const tl = dateLabel(today);
    $datesFixed.appendChild(mkChip(today, '今天', tl.week));
  }
  // 下排：全部日期横向滚动（含"今天"，点今天时条内的今天chip会被激活并滚动居中，实现复位效果）
  for (const ds of dates) {
    const { label, week } = dateLabel(ds);
    $dates.appendChild(mkChip(ds, label, week));
  }
  // 滚动到选中项，保证可见
  requestAnimationFrame(() => {
    const active = $dates.querySelector('.active');
    if (active) active.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  });
  updateArrows();
}

function updateArrows() {
  const el = $dates;
  const prev = document.getElementById('datePrev');
  const next = document.getElementById('dateNext');
  prev.classList.toggle('off', el.scrollLeft <= 2);
  next.classList.toggle('off', el.scrollLeft + el.clientWidth >= el.scrollWidth - 2);
}

document.getElementById('datePrev').onclick = () => $dates.scrollBy({ left: -240, behavior: 'smooth' });
document.getElementById('dateNext').onclick = () => $dates.scrollBy({ left: 240, behavior: 'smooth' });
$dates.addEventListener('scroll', updateArrows, { passive: true });

// ---------- 列表 ----------
function renderList() {
  // 按 日期+时间 升序排序，保证"全部"视图下多数据源的日期分组也是按时间轴排列
  const ev = filtered().slice().sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  if (ev.length === 0) {
    // B3: 推荐为空时给出降级提示，告诉用户"全部"里有多少场
    if (category === 'recommended') {
      const allCount = cache ? cache.events.filter(e => !dateFilter || e.date === dateFilter).length : 0;
      $list.innerHTML = `<div class="empty">今日暂无关注赛事<br><a href="javascript:void(0)" onclick="document.querySelector('.segmented button:nth-child(2)').click()" style="color:var(--accent);text-decoration:underline;">查看全部 ${allCount} 场</a></div>`;
    } else {
      $list.innerHTML = '<div class="empty">暂无赛事</div>';
    }
    return;
  }
  $list.innerHTML = '';
  let lastDate = '';
  for (const e of ev) {
    if (dateFilter === '' && e.date !== lastDate) {
      lastDate = e.date;
      const { label, week } = dateLabel(e.date);
      const head = document.createElement('div');
      head.className = 'ghead';
      head.textContent = `${label.replace('.', '月')}日 ${week}`;
      $list.appendChild(head);
    }
    const div = document.createElement('div');
    div.className = 'erow';
    const mid = e.score ? `<span class="score">${e.score.replace('-', ' - ')}</span>` : '<span class="vs">vs</span>';
    // B9: home==away 或两者都为空时，只显示一次队名/赛事名，避免"天下足球 天下足球"这种重复
    let teams;
    if (e.home && e.away && e.home !== e.away) {
      teams = `${e.home}${mid}${e.away}`;
    } else if (e.home) {
      teams = e.home;
    } else {
      teams = e.league || '赛事';
    }
    // B8: 无具体时间时不显示 "--"，留空更干净
    const timeStr = e.time || '';
    div.innerHTML = `
      <div class="t">${e.time || '--'}</div>
      <div class="mid">
        <div class="league">
          <span class="name">${e.league || ''}</span>
          ${e.important ? '<span class="hot">重要</span>' : ''}
        </div>
        <div class="teams">${teams}</div>
      </div>
      <div class="right">
        ${status}
        ${e.channel ? `<span class="channel">${e.channel}</span>` : ''}
        ${e.url ? `<a class="watch" href="${e.url}" target="_blank" rel="noopener">观看</a>` : ''}
      </div>`;
    $list.appendChild(div);
  }
}

function render() {
  if (!cache) return;
  const dates = availableDates();
  // 当前页签（不含日期过滤）下有比赛的日期集合 → 日期条高亮标记
  const catEvents = category === 'recommended'
    ? cache.events.filter(isRecommended) // 与 filtered() 保持一致
    : category === 'all'
      ? cache.events
      : cache.events.filter(e => matchCategory(e, category));
  const matchDates = new Set(catEvents.map(e => e.date));
  renderDates(dates, matchDates);
  renderList();
  // 页签数量跟随所选日期：先按日期过滤，再统计各分类
  const base = dateFilter ? cache.events.filter(e => e.date === dateFilter) : cache.events;
  const counts = {};
  for (const key of ALL_KEYS) {
    counts[key] = key === 'recommended'
      ? base.filter(isRecommended).length
      : key === 'all'
        ? base.length
        : base.filter(e => matchCategory(e, key)).length;
  }
  renderSegmented(counts);
  renderTabs(counts);
  $meta.textContent = `共 ${counts.all} 场 · 更新于 ${fmtDateTime(cache.crawledAt)}`;
}

async function load() {
  try {
    // 始终拉取全量数据，分类/日期过滤在前端完成，保证各页签数量统计正确
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    cache = { crawledAt: data.crawledAt, today: localToday(), events: data.events };
    if (!dateInited) {
      dateInited = true;
      const t = localToday();
      if (availableDates().includes(t)) dateFilter = t; // 初始页面默认展示当天赛事
    }
    if (dateFilter && !availableDates().includes(dateFilter)) dateFilter = '';
    render();
  } catch (e) {
    $list.innerHTML = `<div class="err">加载失败：${e.message}</div>`;
  }
}

// ---------- 实时比分自动刷新 ----------
// 比分接口 bifen4m.qiumibao.com 允许跨域(*)，本地/线上浏览器都可直连，无需经过服务器
// 每 60 秒拉一次今天的足篮赛事比分，有变化才重绘列表（页签/日期条不动，数量不受比分影响）
const SCORE_API = 'https://bifen4m.qiumibao.com/json/list.htm';

// 同队判定：双向包含 + 常见全称/简称别名（比分接口用全称"曼彻斯特联"，赛程页用简称"曼联"）
function sameCn(a, b) {
  if (!a || !b) return false;
  if (a.includes(b) || b.includes(a)) return true;
  const ALIAS = [['曼联', '曼彻斯特联'], ['曼城', '曼彻斯特城']];
  return ALIAS.some(([x, y]) => (a.includes(x) || a.includes(y)) && (b.includes(x) || b.includes(y)));
}

async function refreshLiveScores() {
  if (!cache || document.hidden) return; // 页面不可见时不请求，省流量
  const today = localToday();
  // 只刷今天的足球/篮球赛事（WTT/德乒比分不走这个接口）
  const todays = cache.events.filter(e =>
    e.date === today && (e.type === 'football' || e.type === 'basketball') && e.home && e.away);
  if (todays.length === 0) return;
  let list;
  try {
    const r = await fetch(SCORE_API, { cache: 'no-store' });
    if (!r.ok) return;
    list = (await r.json()).list || [];
  } catch { return; }
  let changed = false;
  for (const e of todays) {
    const hit = list.find(s =>
      s.sdate === e.date
      && (s.type === 'football' || s.type === 'basketball')
      && (s.state === '2' || s.state === '3') // 进行中/完赛才写比分
      && (sameCn(s.home_team, e.home) || sameCn(s.visit_team, e.away))); // 单边命中即可，防止换边/简称差异
    if (!hit) continue;
    const score = `${hit.home_score}-${hit.visit_score}`;
    const status = hit.state === '2' ? '进行中' : '已结束';
    if (e.score !== score || e.status !== status) {
      e.score = score;
      e.status = status;
      changed = true;
    }
  }
  if (changed) renderList();
}

setInterval(refreshLiveScores, 60 * 1000);

const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
// 主题已在 head 脚本中初始化，这里只同步按钮图标
let theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
function syncThemeBtn() {
  themeBtn.innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
  themeBtn.title = theme === 'dark' ? '切换浅色模式' : '切换深色模式';
}

  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', theme);
  document.documentElement.classList.toggle('dark', theme === 'dark');
  syncThemeBtn();
};
syncThemeBtn();

// ---------- 今日赛事卡片（网页版，新标签页打开） ----------
document.getElementById('cardBtn').onclick = () => {
  window.open('data/card.html', '_blank'); // 每天由爬取自动更新；可直接复制到邮件正文
};

if (IS_STATIC) {
  // 静态部署下数据由 GitHub Actions 每天定时更新，隐藏手动抓取按钮
  document.getElementById('refresh').style.display = 'none';
} else {
  const refreshBtn = document.getElementById('refresh');
  refreshBtn.onclick = async () => {
    // B5: 点击后加旋转动画+禁用，防止重复点击
    refreshBtn.classList.add('loading');
    $meta.textContent = '正在抓取最新数据…';
    try {
      await fetch('/api/crawl');
      await load();
    } finally {
      refreshBtn.classList.remove('loading');
    }
  };
}

load();
// 每 5 分钟自动刷新页面数据
setInterval(load, 5 * 60 * 1000);
// 首次加载后 6 秒先刷一次实时比分（之后每 60 秒自动刷，见 refreshLiveScores）
setTimeout(refreshLiveScores, 6000);
</script>
