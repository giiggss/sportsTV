services:
  tvguide:
    build: .
    ports:
      # 宿主端口用 TVGUIDE_PORT 控制（默认3000），容器内部固定 3000
      - "${TVGUIDE_PORT:-3000}:3000"
    environment:
      # Server酱 key（sctp 开头的付费版 key），比分变化/德乒局分提醒用
      - SERVERCHAN_KEY=${SERVERCHAN_KEY}
      # 赛前提醒：容器常开并接管提醒时在 .env 里设 LOCAL_REMINDERS=true（云端 workflow 已停用，不会重复）
      - LOCAL_REMINDERS=${LOCAL_REMINDERS:-false}
      # 付费版额度充足，比分/局分推送默认开启；如需省额度可在 .env 设 false
      - SCORE_UPDATES=${SCORE_UPDATES:-true}
      - TT_UPDATES=${TT_UPDATES:-true}
      # 推送通知里「打开卡片」的链接，指向本容器经 NPM 反代的公网地址（不设则代码默认同值）
      - CARD_URL=https://sportstv.techmanclub.com/data/card.html
    volumes:
      # 持久化爬取数据与比分/提醒状态，重建容器不丢历史（首次启动用镜像内种子数据初始化）
      - tvguide-data:/app/data
    restart: unless-stopped

volumes:
  tvguide-data:
