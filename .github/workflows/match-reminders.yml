name: 赛前提醒
on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟检查一次（开赛前30分钟、前10分钟、开赛时各提醒一次）
  workflow_dispatch: {}    # 支持手动触发测试

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取最新赛程
        run: node crawler.js

      - name: 检查并发送赛前提醒
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node notify.js reminders

      - name: 提交提醒状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/notify-state.json ]; then
            git add -f data/notify-state.json data/events.json data/card.html
          else
            git add -f data/events.json data/card.html
          fi
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新提醒状态"
            git pull --rebase origin main
            git push
          fi
