name: 赛前提醒
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '30 18 * * *'
    - cron: '50 18 * * *'
    - cron: '0 19 * * *'
    - cron: '20 19 * * *'
    - cron: '30 19 * * *'
    - cron: '5 11 * * *'
    - cron: '25 11 * * *'
    - cron: '35 11 * * *'
    - cron: '15 18 * * *'
    - cron: '35 18 * * *'
    - cron: '45 18 * * *'
    - cron: '55 18 * * *'
    - cron: '5 19 * * *'
    - cron: '30 13 * * *'
    - cron: '50 13 * * *'
    - cron: '0 14 * * *'
    - cron: '45 13 * * *'
    - cron: '5 14 * * *'
    - cron: '15 14 * * *'
    - cron: '30 15 * * *'
    - cron: '50 15 * * *'
    - cron: '0 16 * * *'
    - cron: '20 16 * * *'
    - cron: '30 16 * * *'
    - cron: '30 10 * * *'
    - cron: '50 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 12 * * *'
    - cron: '50 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
    - cron: '20 15 * * *'
    - cron: '15 16 * * *'
    - cron: '35 16 * * *'
    - cron: '45 16 * * *'
    - cron: '30 0 * * *'
    - cron: '50 0 * * *'
    - cron: '0 1 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch: {}    # 支持手动触发测试

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取最新赛程
        run: node crawler.js

      - name: 检查并发送赛前提醒
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: node notify.js reminders

      - name: 提交提醒状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/notify-state.json ]; then
            git add -f data/notify-state.json data/events.json data/card.html data/score-history.json
          else
            git add -f data/events.json data/card.html data/score-history.json
          fi
          git add .github/workflows/match-reminders.yml
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新提醒状态"
            git pull --rebase origin main
            git push
          fi
